# Mentat desktop: unsigned Windows x64 installer built on a free standard GitHub-hosted runner, either a manual-install
# PREVIEW or (RELEASE_PUBLISHER set) the unsigned INPUT of a signed release.
# Repo path: .github/workflows/desktop-windows.yml on pjg93-222/Mentat main. Modelled on pjg93-222/Melange
# desktop-windows.yml at 7d14512d5 (the Melange 1.0.5 signed-release input build); the differences are listed below.
#
# Signed-release input mode (release owner, 2026-10-16/17: self-signed certificate trusted only on his machines).
# RELEASE_PUBLISHER is the certificate's exact SignerCertificate.Subject, a public value; the Package step bakes it in as
# WINDOWS_PUBLISHER_NAME (package.json windowsPublisherName and app-update.yml publisherName), so the packaged updater
# accepts only installers Windows reports Valid for that subject. No signing material exists here: the installer stays
# NotSigned, the draft below stays an unsigned preview, and STABLE_TAG (desktop-v$VERSION, which must not exist yet) is
# created later on the release owner's PC, after he Authenticode-signs this run's artifact there
# (C:\ReleaseAcceptance\signing\Sign-And-Publish-Release.ps1 and ops/desktop/GITHUB_RELEASES.md). That script downloads
# the artifact named mentat-desktop-<github.sha> of a successful push/workflow_dispatch run of this file on main.
#
# Source binding: the build is always github.sha on refs/heads/main. That commit may differ from the reviewed source
# REVIEWED_BASE only by the CI files in CI_FILES; anything else fails the job.
# Integration (two commits on main): first the reviewed source commit T, whose tree has NO .github/workflows/; then the
#   CI commit that restores the workflow files and sets REVIEWED_BASE = RELEASE_TARGET = T's full SHA. Preflight refuses
#   anything else (non-hex, zero or unequal pins, T missing, or T carrying .github/workflows/) before any build minute.
#   The release targets T, not github.sha: the REST API refuses GITHUB_TOKEN a release whose target commit adds files
#   under .github/workflows/ relative to the default branch. github.sha differs from T only by CI_FILES; provenance
#   records both.
# Triggers: the push that adds or changes the files under on.push.paths, plus workflow_dispatch with source_sha equal to
#   github.sha (this repository's default branch is main, so dispatch is registered once the file is on main).
#
# Mentat differences from the Melange workflow:
# - Native R 4.6.0 (97 library directories) and Node 24.18.0 are RESTORED, not rebuilt (release-owner ruling D-M1;
#   R frozen, D-M9): from the published Mentat 1.0.3 preview zip, pinned by size + sha256, then checked file by file
#   against ops/desktop/packaging/mentat-native-runtime.sha256 (generated from that zip; equal to the native trees of
#   the installed 1.0.1 and 1.0.3). The check is repeated on the final win-unpacked tree. No LibreOffice.
# - The build venv (hash-locked, becomes the bundled runtime's site-packages) holds no test tools; the tests use a
#   separate test venv from mentat-runtime.constraints.txt + mentat-test.constraints.txt.
# - Third-party notices INSIDE the package (D-M4): ops/desktop/packaging/THIRD-PARTY-NOTICES/mentat/ is copied unchanged
#   to resources/runtime/mentat/THIRD-PARTY-NOTICES/ next to the generated Python-and-packages.md, and verified byte for
#   byte in win-unpacked and the zip. redistributionReview.status is NOT evidence-complete: the GPL written source offer
#   and its contact are open for the owner, who rules on the redistribution gate.
#
# Jobs: preflight (API reads only) -> build (Windows, contents: read) -> release (gh/curl only, contents: write).
# - preflight fails if a release or tag named RELEASE_TAG exists, unless it is this workflow's own DRAFT for this exact
#   commit (then the build is skipped and release resumes it); and fails if another run of this workflow for the same
#   commit is in progress or has succeeded.
# - release creates (or resumes) a DRAFT prerelease by release ID, uploads only missing assets, never overwrites, verifies
#   every asset's sha256, and STOPS at the draft for owner review. There is no step or input that makes it public.
# Recovery: re-run failed jobs (`gh run rerun <run id> --failed`). The release job recomputes its own state from the
#   releases API and never trusts preflight's mode. Resuming needs the build artifact (7-day retention; the signing step
#   also downloads it). If it has expired the job fails; rebuilding is then a deliberate decision (delete the stale draft
#   by hand, then dispatch).
#
# Actions are pinned to full commit SHAs (the same pins as the Melange workflow; trailing comment = floating tag and the
# exact patch tag). No secrets other than GITHUB_TOKEN. Nothing here signs, installs or launches the packaged app.
name: desktop-windows
run-name: Mentat desktop ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-windows.yml
      - ops/desktop/packaging/desktop-access-trust.public.json
      - ops/desktop/packaging/mentat-runtime.constraints.txt
      - ops/desktop/packaging/mentat-test.constraints.txt
      - ops/desktop/packaging/mentat-native-runtime.sha256
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA of the main commit to build; must equal the dispatched ref's head
        required: true
        type: string
      publish:
        description: Create (or resume) the DRAFT prerelease after a green build (it never becomes public from this workflow)
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: desktop-windows-${{ github.repository }}
  cancel-in-progress: false

env:
  APP: mentat
  PRODUCT: Mentat
  VERSION: 1.0.15
  RELEASE_TAG: desktop-preview-v1.0.15
  # Signed-release input mode (header). Both empty = plain preview.
  RELEASE_PUBLISHER: 'CN=Melange Systems Desktop Release (self-signed)'
  STABLE_TAG: desktop-v1.0.15
  ARTIFACT: mentat-desktop-${{ github.sha }}
  # SET AT INTEGRATION: both to the full 40-hex SHA of reviewed source commit T (see the header). Until then preflight fails.
  REVIEWED_BASE: 53b78491cae9fd5ca69f5f4b1a4d4cef0a75aa99
  RELEASE_TARGET: 53b78491cae9fd5ca69f5f4b1a4d4cef0a75aa99
  CI_FILES: .github/workflows/desktop-windows.yml .github/workflows/desktop-installer-acceptance.yml
  TRUST_FILE: ops/desktop/packaging/desktop-access-trust.public.json
  TRUST_SHA256: b169ed5c01c32cc71469589144a84679901d8581d8eb487827456b278eadc92a
  CONSTRAINTS: ops/desktop/packaging/mentat-runtime.constraints.txt
  TEST_CONSTRAINTS: ops/desktop/packaging/mentat-test.constraints.txt
  NATIVE_MANIFEST: ops/desktop/packaging/mentat-native-runtime.sha256
  NATIVE_ZIP_URL: https://github.com/pjg93-222/Mentat/releases/download/desktop-preview-v1.0.3/Mentat-1.0.3-win-x64-unsigned-preview.zip
  NATIVE_ZIP_SHA256: 54aa6ea0e26d34f2947a2d18ca06313733627dfa319732f0c14e09275e90fb40
  NATIVE_ZIP_SIZE: '455859261'
  NOTICES_DIR: ops/desktop/packaging/THIRD-PARTY-NOTICES/mentat

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: write only because draft releases are listed solely to callers with push access (REST "List releases");
    # this job runs gh api reads only (no checkout, no third-party code). actions: read for the run list.
    permissions:
      contents: write
      actions: read
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Bind to main and the requested SHA
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::builds run only from refs/heads/main, not $GITHUB_REF"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ && "$INPUT_SHA" = "$GITHUB_SHA" ]] \
              || { echo "::error::source_sha '$INPUT_SHA' must be the full SHA of the dispatched main head $GITHUB_SHA"; exit 1; }
          fi

      - id: check
        name: Pins, existing release, tag and runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Source pins: one full SHA, not the placeholder, an existing commit, whose tree has no .github/workflows/
          # (the API refuses a GITHUB_TOKEN release on a target that adds workflow files relative to the default branch).
          [[ "$REVIEWED_BASE" =~ ^[0-9a-f]{40}$ && "$REVIEWED_BASE" != 0000000000000000000000000000000000000000 && "$RELEASE_TARGET" = "$REVIEWED_BASE" ]] \
            || { echo "::error::REVIEWED_BASE '$REVIEWED_BASE' and RELEASE_TARGET '$RELEASE_TARGET' must be the same full SHA (set at integration)"; exit 1; }
          [ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TARGET" --jq .sha)" = "$RELEASE_TARGET" ] \
            || { echo "::error::RELEASE_TARGET $RELEASE_TARGET is not a commit in $GH_REPO"; exit 1; }
          if probe=$(gh api "repos/$GH_REPO/contents/.github/workflows?ref=$RELEASE_TARGET" 2>&1); then
            echo "::error::RELEASE_TARGET $RELEASE_TARGET carries .github/workflows/; it must be the workflow-free source commit"; exit 1
          fi
          grep -q 'HTTP 404' <<<"$probe" || { echo "::error::could not establish that RELEASE_TARGET has no .github/workflows/: $probe"; exit 1; }
          # Signed-release input: a CN= subject that is not a test identity, and a still-unused stable desktop-v tag.
          if [ -n "$RELEASE_PUBLISHER" ] || [ -n "$STABLE_TAG" ]; then
            [[ "$RELEASE_PUBLISHER" == CN=* && "$RELEASE_PUBLISHER" != *TEST* && "$STABLE_TAG" = "desktop-v$VERSION" ]] \
              || { echo "::error::signed-release input needs RELEASE_PUBLISHER 'CN=...' (not a TEST subject) and STABLE_TAG desktop-v$VERSION"; exit 1; }
            stable=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate | jq -s --arg t "$STABLE_TAG" '[add[] | select(.tag_name == $t)] | length')
            [ "$stable" -eq 0 ] || { echo "::error::a release named $STABLE_TAG already exists; a signed release is never rebuilt"; exit 1; }
            if gh api "repos/$GH_REPO/git/ref/tags/$STABLE_TAG" >/dev/null 2>&1; then echo "::error::tag $STABLE_TAG already exists"; exit 1; fi
          fi
          # Every release, drafts included, matched on tag_name.
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate | jq -s --arg t "$RELEASE_TAG" '[add[] | select(.tag_name == $t)]' > matches.json
          tag_exists=no; gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1 && tag_exists=yes
          count=$(jq length matches.json)
          mode=build
          if [ "$tag_exists" = yes ]; then echo "::error::tag $RELEASE_TAG already exists"; exit 1; fi
          if [ "$count" -gt 1 ]; then echo "::error::$count releases are named $RELEASE_TAG"; exit 1; fi
          if [ "$count" -eq 1 ]; then
            jq -e --arg t "$RELEASE_TARGET" '.[0].draft == true and .[0].target_commitish == $t' matches.json >/dev/null \
              || { echo "::error::$RELEASE_TAG exists and is not this workflow's draft for this commit"; exit 1; }
            # A provenance asset, if one was uploaded before the failure, must name this commit.
            asset_id=$(jq -r --arg n "$PRODUCT-$VERSION-provenance.json" '[.[0].assets[] | select(.name == $n)] | if length == 1 then .[0].id else empty end' matches.json)
            if [ -n "$asset_id" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
                "$GITHUB_API_URL/repos/$GH_REPO/releases/assets/$asset_id" -o prov.json
              jq -e --arg sha "$GITHUB_SHA" '.sourceCommit == $sha' prov.json >/dev/null \
                || { echo "::error::draft provenance does not name $GITHUB_SHA"; exit 1; }
            fi
            mode=resume
          fi
          # Other runs of this workflow for this commit (this run excluded; a re-run keeps the same run ID).
          gh run list --workflow desktop-windows.yml --commit "$GITHUB_SHA" --limit 100 --json status,conclusion,databaseId \
            | jq --argjson me "$GITHUB_RUN_ID" '[.[] | select(.databaseId != $me)]' > runs.json
          active=$(jq '[.[] | select(.status != "completed")] | length' runs.json)
          succeeded=$(jq '[.[] | select(.conclusion == "success")] | length' runs.json)
          [ "$active" -eq 0 ] || { echo "::error::another run for $GITHUB_SHA is in progress"; jq . runs.json; exit 1; }
          if [ "$mode" = build ] && [ "$succeeded" -gt 0 ]; then echo "::error::a run for $GITHUB_SHA already succeeded"; jq . runs.json; exit 1; fi
          echo "mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.mode == 'build'
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DESKTOP_APP_ID: mentat
      DESKTOP_UPDATE_PROVIDER: github
      DESKTOP_GITHUB_REPOSITORY: pjg93-222/Mentat
      DESKTOP_ACCESS_TRUST: ${{ github.workspace }}\ops\desktop\packaging\desktop-access-trust.public.json
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # Check out the committed blob bytes (no CRLF conversion), so staged sources equal the Git blobs.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (= v4.4.0)
        with:
          persist-credentials: false

      - name: Source equals the reviewed commit plus CI files only
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch --no-tags --depth=1 origin $env:REVIEWED_BASE
          $changed = @(git diff --name-only --no-renames $env:REVIEWED_BASE HEAD)
          $extra = @($changed | Where-Object { $_ -cnotin ($env:CI_FILES -split ' ') })
          if ($extra.Count) { throw ("Commit differs from reviewed base in non-CI files: " + ($extra -join ', ')) }
          "Diff vs ${env:REVIEWED_BASE}: " + ($changed -join ', ')
          $hash = (Get-FileHash -LiteralPath $env:TRUST_FILE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne $env:TRUST_SHA256) { throw "Trust descriptor sha256 $hash is not the installed apps' descriptor; a change is a key transition" }

      - name: Layout
        run: |
          $t = $env:RUNNER_TEMP
          @(
            "VENV=$t\venv", "TESTVENV=$t\testvenv", "NATIVE_ROOT=$t\native", "NATIVE_WORK=$t\nativework",
            "DESKTOP_BUILD_ROOT=$t\build", "DESKTOP_RUNTIME_ROOT=$t\runtime", "DESKTOP_DIST_ROOT=$t\dist", "OUT=$t\out"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          New-Item -ItemType Directory -Force "$t\out", "$t\native", "$t\nativework" | Out-Null
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Out-String

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (= v5.6.0)
        with:
          python-version: '3.12.10'   # the installed 1.0.1 runtimes' interpreter

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (= v4.4.0)
        with:
          node-version: '24.18.0'     # pinned toolchain version used for the 1.0.3 client tests and packaging

      # Fresh venvs, hash-locked (bundle_python.py requires a venv without global site packages). VENV becomes the bundled
      # runtime's site-packages, so it holds only the runtime lock; TESTVENV adds pytest for the tests and is never shipped.
      - name: Python build and test environments (hash-locked)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv $env:VENV
          & "$env:VENV\Scripts\python.exe" -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: --no-deps -r $env:CONSTRAINTS
          & "$env:VENV\Scripts\python.exe" -m pip check
          & "$env:VENV\Scripts\python.exe" -m pip freeze --all | Set-Content -LiteralPath "$env:OUT\pip-freeze.txt" -Encoding utf8
          python -m venv $env:TESTVENV
          & "$env:TESTVENV\Scripts\python.exe" -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: --no-deps -r $env:CONSTRAINTS -r $env:TEST_CONSTRAINTS
          & "$env:TESTVENV\Scripts\python.exe" -m pip check
          if (Get-ChildItem -LiteralPath "$env:VENV\Lib\site-packages" -Filter 'pytest*' -Directory) { throw 'pytest must not be in the build venv (it would ship)' }

      - name: Gate - every console and server requirements pin is in the hash lock
        shell: python
        run: |
          import os, re
          norm = lambda s: re.sub(r'[-_.]+', '-', s.strip()).lower()
          lock = {norm(m[0]) + '==' + m[1] for m in re.findall(r'^([A-Za-z0-9_.-]+)==(\S+)', open(os.environ['CONSTRAINTS'], encoding='utf-8').read(), re.M)}
          pins = []
          for f in ('mentat/requirements-console.txt', 'ops/desktop/server/requirements.txt'):
              pins += [l.split('#')[0].strip() for l in open(f, encoding='utf-8') if '==' in l.split('#')[0]]
          missing = [p for p in pins if norm(p.split('==')[0]) + '==' + p.split('==')[1] not in lock]
          assert not missing, f'requirements pins absent from the hash lock: {missing}'
          print(f'{len(pins)} pins covered by {len(lock)} hashed entries')

      # The desktop boundary tests for the packaged Mentat backend and its bootstrap modules, in the test venv. An explicit
      # list, not a glob: only tests known to pass on this source (2026-10-17, local run in a hash-locked venv). The third
      # test_mentat_layout case needs MENTAT_TEST_ENGINE (a private engine checkout) and is not run. mentat/tests suites
      # need private fixtures and are not run here (provenance notVerified). Runs before any download or packaging.
      # The runner's TEMP is an 8.3 short path (C:\Users\RUNNER~1\...). mentat_layout.load_connections resolves its paths,
      # which expands that to C:\Users\runneradmin\..., while test_mentat_layout builds its expected paths from the unresolved
      # TEMP, so the two spellings of one folder compare unequal (run 39076231955). The tests therefore run under a long-form
      # temp folder in RUNNER_TEMP (D:\a\_temp has no short-name component); the code under test is unchanged.
      - name: Python desktop boundary tests (explicit list)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:TEMP = $env:TMP = $env:TMPDIR = Join-Path $env:RUNNER_TEMP 'pytest-tmp'
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          & "$env:TESTVENV\Scripts\python.exe" -E -s -m pytest -p no:cacheprovider -q -rs `
            ops/desktop/packaging/test_staging.py `
            "ops/desktop/packaging/test_mentat_layout.py::MentatLayoutTests::test_installed_code_and_own_data_have_distinct_verified_targets" `
            "ops/desktop/packaging/test_mentat_layout.py::MentatLayoutTests::test_explicit_connections_reject_wrong_selection_and_binary_overlap" `
            ops/desktop/packaging/test_desktop_backend.py `
            ops/desktop/packaging/test_desktop_audit.py `
            ops/desktop/packaging/test_desktop_migrations.py `
            ops/desktop/packaging/test_desktop_figure_renderer.py `
            ops/desktop/packaging/test_native_access_state.py `
            ops/desktop/packaging/test_native_access_scopes.py `
            ops/desktop/packaging/test_authenticode_binding.py 2>&1 | Tee-Object -FilePath "$env:OUT\python-tests.log"
          if ($LASTEXITCODE -ne 0) { throw "Python desktop tests failed (exit $LASTEXITCODE)" }

      - name: Gate - checkout unchanged except ignored bytecode
        shell: python
        run: |
          import subprocess
          dirty = [l for l in subprocess.check_output(['git', 'status', '--porcelain', '--ignored'], text=True).splitlines()
                   if l and '__pycache__/' not in l and not l.endswith('.pyc')]
          assert not dirty, f'tests left files in the checkout: {dirty[:20]}'

      - name: Download the pinned Mentat 1.0.3 preview zip (native R and Node source)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Join-Path $env:NATIVE_WORK 'mentat-1.0.3-preview.zip'
          curl.exe --fail --location --proto '=https' --tlsv1.2 --silent --show-error --retry 3 --max-time 1200 --output $zip $env:NATIVE_ZIP_URL
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $zip).Length
          if ($hash -cne $env:NATIVE_ZIP_SHA256 -or $size -ne [int64]$env:NATIVE_ZIP_SIZE) { throw "1.0.3 zip mismatch: sha256 $hash size $size; nothing was extracted." }

      # Extract only win-unpacked/resources/runtime/mentat/native/{R,Node}/ (the zip's top folder is win-unpacked/), refuse
      # any entry the manifest does not name, then require every file to equal the committed manifest.
      - name: Gate - restore native R and Node; every file equals the committed manifest
        shell: python
        run: |
          import hashlib, os, pathlib, shutil, zipfile
          env = os.environ
          root, zpath = pathlib.Path(env['NATIVE_ROOT']), pathlib.Path(env['NATIVE_WORK']) / 'mentat-1.0.3-preview.zip'
          prefix = 'win-unpacked/resources/runtime/mentat/native/'
          def sha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''): h.update(b)
              return h.hexdigest()
          want = {}
          for line in open(env['NATIVE_MANIFEST'], encoding='utf-8', newline=''):
              assert line.endswith('\n') and not line.endswith('\r\n'), 'manifest must be LF'
              h, rel = line[:-1].split('  ', 1); want[rel] = h
          files = dirs = 0
          with zipfile.ZipFile(zpath) as z:
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  if not name.startswith(prefix): continue
                  rel = name[len(prefix):].rstrip('/')
                  if rel.split('/')[0] not in ('R', 'Node'): continue
                  parts = rel.split('/')
                  assert all(p not in ('', '.', '..') and ':' not in p for p in parts), f'unsafe zip entry {name}'
                  dest = root.joinpath(*parts)
                  if info.is_dir():
                      dest.mkdir(parents=True, exist_ok=True); dirs += 1; continue
                  assert rel in want, f'zip entry not in the manifest: {rel}'
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, open(dest, 'wb') as out: shutil.copyfileobj(src, out, 1 << 20)
                  files += 1
          zpath.unlink()
          assert sorted(p.name for p in root.iterdir()) == ['Node', 'R'], list(root.iterdir())
          have = {p.relative_to(root).as_posix(): sha(p) for p in root.rglob('*') if p.is_file()}
          bad = sorted(p for p in set(want) | set(have) if want.get(p) != have.get(p))
          assert not bad, f'{len(bad)} native files differ from the manifest: {bad[:20]}'
          print(f'{files} native files ({dirs} directory entries) restored and equal to {env["NATIVE_MANIFEST"]}')

      - name: Build private runtime
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:VENV\Scripts\python.exe" ops/desktop/packaging/build_runtime.py --app mentat --source . --native-root $env:NATIVE_ROOT --build-root $env:DESKTOP_BUILD_ROOT --runtime-root $env:DESKTOP_RUNTIME_ROOT

      # build_runtime.py only RECORDS missing native runtimes; this gate fails before any packaging.
      - name: Gate - native runtimes complete; add third-party notices
        shell: python
        run: |
          import email, json, os, pathlib, re, shutil, sys
          env = os.environ
          runtime = pathlib.Path(env['DESKTOP_RUNTIME_ROOT']) / 'mentat'
          status = json.loads((runtime / 'runtime-status.json').read_text(encoding='utf-8'))
          assert status['appId'] == 'mentat', status
          assert status['missingNativeRuntimes'] == [], f"missing native runtimes: {status['missingNativeRuntimes']}"
          for f in ('R/bin/x64/R.dll', 'R/bin/Rscript.exe', 'R/dependency-inventory.json', 'R/COPYING', 'R/doc/COPYRIGHTS',
                    'R/share/licenses/GPL-2', 'R/share/licenses/GPL-3', 'Node/node.exe', 'Node/LICENSE.txt'):
              assert (runtime / 'native' / f).is_file(), f'native/{f} absent from the runtime'
          # Committed notices (R GPL notice, R and Node sources with sha256, the 1.0.3 sources and notices), unchanged.
          notices = runtime / 'THIRD-PARTY-NOTICES'
          shutil.copytree(env['NOTICES_DIR'], notices)
          shutil.copyfile(pathlib.Path(env['NOTICES_DIR']) / 'R-and-Node-SOURCES.md', pathlib.Path(env['OUT']) / 'R-and-Node-SOURCES.md')
          # Python and package notices, from each bundled wheel's dist-info METADATA.
          sp = runtime / 'python' / 'Lib' / 'site-packages'
          rows = []
          for d in sorted(sp.glob('*.dist-info'), key=lambda p: p.name.lower()):
              m = email.message_from_bytes((d / 'METADATA').read_bytes())
              lic = (m.get('License-Expression') or '').strip()
              if not lic:
                  classifiers = [c.split('::')[-1].strip() for c in (m.get_all('Classifier') or []) if c.startswith('License ::')]
                  text = (m.get('License') or '').strip()
                  lic = '; '.join(classifiers) or (text.splitlines()[0][:100] if text else '')
              files = sorted(p.relative_to(sp).as_posix() for p in d.rglob('*') if p.is_file() and re.search(r'LICEN[CS]E|COPYING|NOTICE|AUTHORS', p.name, re.I))
              assert lic or files, f'{d.name}: no license metadata and no license file'
              rows.append((m['Name'], m['Version'], lic or 'see license files', files))
          pyver = '.'.join(map(str, sys.version_info[:3]))
          lines = [f'# Python {pyver} and bundled packages ({env["PRODUCT"]} desktop)', '',
                   f'- CPython {pyver} (64-bit Windows build from python.org via actions/setup-python), at `resources/runtime/{env["APP"]}/python/`.',
                   '  License: Python Software Foundation License Version 2; full text with the third-party terms of bundled components (OpenSSL, libffi, SQLite, expat, zlib and others) in `python/LICENSE.txt`.',
                   f'  Source: <https://www.python.org/ftp/python/{pyver}/Python-{pyver}.tar.xz>.',
                   '- `python/vcruntime140.dll`, `python/vcruntime140_1.dll`: Microsoft Visual C++ runtime as shipped with the python.org CPython installer.',
                   '', '| Package | Version | License (from METADATA) | License files in the package (under site-packages) | Source |', '|---|---|---|---|---|']
          for name, ver, lic, files in rows:
              lines.append(f"| {name} | {ver} | {lic.replace('|', '/')} | {'<br>'.join(files) or '-'} | <https://pypi.org/project/{name}/{ver}/#files> |")
          text = '\n'.join(lines) + '\n'
          (notices / 'Python-and-packages.md').write_text(text, encoding='utf-8', newline='\n')
          (pathlib.Path(env['OUT']) / 'Python-and-packages.md').write_text(text, encoding='utf-8', newline='\n')
          (runtime / 'source-provenance.json').write_text(json.dumps({
              'app': 'mentat', 'repository': env['GITHUB_REPOSITORY'], 'commit': env['GITHUB_SHA'],
              'reviewedBase': env['REVIEWED_BASE'], 'runId': env['GITHUB_RUN_ID'], 'runAttempt': env['GITHUB_RUN_ATTEMPT']}, indent=2), encoding='utf-8')
          # Free the runner disk: the native trees were copied into the runtime; the build root holds only a staging copy.
          shutil.rmtree(env['NATIVE_ROOT']); shutil.rmtree(env['DESKTOP_BUILD_ROOT']); shutil.rmtree(env['NATIVE_WORK'])
          print(json.dumps(status, indent=2), f'\n{len(rows)} Python packages listed;', len(list(notices.iterdir())), 'notice files')

      - name: Client install, tests and audit; release-producer tests against the locked client
        working-directory: ops/desktop/client
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $v = node -p "require('./package.json').version"
          if ($v -cne $env:VERSION) { throw "client version $v is not $env:VERSION" }
          npm ci --no-fund
          # Tests that generate TLS fixtures spawn DESKTOP_TEST_PYTHON (default: bare `python`, which has no cryptography).
          # Use the fresh build venv (pinned cryptography 49.0.0), never the bundled runtime Python.
          $env:DESKTOP_TEST_PYTHON = "$env:VENV\Scripts\python.exe"
          & $env:DESKTOP_TEST_PYTHON -E -s -c "import cryptography, sys; print(sys.executable, 'cryptography', cryptography.__version__)"
          npm test 2>&1 | Tee-Object -FilePath "$env:OUT\npm-test.log"
          npm audit --omit=dev --audit-level=high
          # github_release.py (the producer the signing step runs) with its client cross-checks, which need node_modules.
          Push-Location $env:GITHUB_WORKSPACE
          $env:TEMP = $env:TMP = $env:TMPDIR = Join-Path $env:RUNNER_TEMP 'pytest-tmp'   # long-form temp, as in the boundary tests
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          $log =& "$env:TESTVENV\Scripts\python.exe" -E -s -m pytest -p no:cacheprovider -q -rs ops/desktop/packaging/test_github_release.py 2>&1
          $code = $LASTEXITCODE; Pop-Location
          $log | Tee-Object -FilePath "$env:OUT\python-tests.log" -Append
          if ($code -ne 0) { throw "test_github_release.py failed (exit $code)" }
          if ($log -match 'skipped') { throw 'test_github_release.py skipped its client cross-checks' }

      # No certificate is configured (CSC_IDENTITY_AUTO_DISCOVERY false, no CSC_LINK or certificateSha1), so electron-builder
      # skips signing every binary; WINDOWS_PUBLISHER_NAME only bakes the public pin (client/builder.cjs:24-25).
      - name: Reviewed module-input contracts and passive public readers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location ops/desktop/packaging
          try {
            & "$env:TESTVENV\Scripts\python.exe" -E -s -B -m unittest -v test_module_data_handoff test_module_public_input_installers test_module_backend_inputs test_module_data_snapshot test_staging test_module_application_inventory test_module_public_input_probe
            if ($LASTEXITCODE -ne 0) { throw "Module input contract tests failed" }
            & "$env:TESTVENV\Scripts\python.exe" -E -s -B -m pytest -p no:cacheprovider -q test_data_release_fetch.py
            if ($LASTEXITCODE -ne 0) { throw "Disabled legacy fetch preservation tests failed" }
            # Exactly one actual Melange graph/payroll test needs fec/; all other launch-contract cases run.
            & "$env:TESTVENV\Scripts\python.exe" -E -s -B -m pytest -p no:cacheprovider -q test_module_data_launch.py -k "not test_actual_graph_and_payroll_configurers_use_synthetic_sources_only"
            if ($LASTEXITCODE -ne 0) { throw "Mentat launch contract tests failed" }
          } finally { Pop-Location }
          node --test ops/desktop/client/tests/module-runtime-boundary.test.cjs ops/desktop/client/tests/module-data-transition.test.cjs ops/desktop/client/tests/module-data-startup.test.cjs ops/desktop/client/tests/main-module-lifecycle.test.cjs ops/desktop/client/tests/main-module-preflight.test.cjs ops/desktop/client/tests/runtime-module-guard.test.cjs ops/desktop/client/tests/module-data-adapters.test.cjs ops/desktop/client/tests/backend-command.test.cjs ops/desktop/client/tests/runtime-roots.test.cjs ops/desktop/client/tests/release-files.test.cjs ops/desktop/client/tests/module-application-contract.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Native module input contract tests failed" }
          & "$env:TESTVENV\Scripts\python.exe" -E -s -B -m pytest -p no:cacheprovider -q mentat/tests/test_public_data.py mentat/tests/test_public_data_http.py
          if ($LASTEXITCODE -ne 0) { throw "Mentat passive public reader tests failed" }
          node --test mentat/app/tests/public-data.test.js
          if ($LASTEXITCODE -ne 0) { throw "Mentat Public data UI tests failed" }

      - name: Package (unsigned NSIS installer plus win-unpacked)
        working-directory: ops/desktop/client
        env:
          WINDOWS_PUBLISHER_NAME: ${{ env.RELEASE_PUBLISHER }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build -- --publish never

      - name: Collect outputs and read packaged configuration
        working-directory: ops/desktop/client
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $dist = Join-Path $env:DESKTOP_DIST_ROOT $env:APP
          $exe = @(Get-ChildItem -LiteralPath $dist -Filter "$env:PRODUCT-$env:VERSION-*.exe" -File)
          if ($exe.Count -ne 1) { throw "Expected one installer in $dist, found $($exe.Count)" }
          $unpacked = Join-Path $dist 'win-unpacked'
          $sig = Get-AuthenticodeSignature -LiteralPath $exe[0].FullName
          if ($sig.Status -ne 'NotSigned') { throw "Installer signature status $($sig.Status); this preview must be unsigned" }
          Move-Item -LiteralPath $exe[0].FullName -Destination (Join-Path $env:OUT "$env:PRODUCT-$env:VERSION-win-x64-unsigned-installer.exe")
          # Zip BEFORE the smoke run so no smoke-written .pyc reaches the zip.
          7z a -tzip -mx=5 -bd (Join-Path $env:OUT "$env:PRODUCT-$env:VERSION-win-x64-unsigned-preview.zip") "$unpacked\*" | Out-Null
          node -e "require('fs').writeFileSync(process.argv[2],require('@electron/asar').extractFile(process.argv[1],'package.json'))" (Join-Path $unpacked 'resources\app.asar') "$env:OUT\packaged-package.json"
          "UNPACKED=$unpacked" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Gate - packaged configuration (trust, update source, fail-closed updater)
        shell: python
        run: |
          import json, os
          pkg = json.load(open(os.path.join(os.environ['OUT'], 'packaged-package.json'), encoding='utf-8-sig'))
          cfg = pkg['desktopAppConfig']
          trust = json.load(open(os.environ['DESKTOP_ACCESS_TRUST'], encoding='utf-8'))
          assert pkg['version'] == os.environ['VERSION'], pkg['version']
          assert cfg['appId'] == os.environ['APP'], cfg['appId']
          assert cfg['desktopAccessTrust'] == trust, 'packaged access trust differs from the committed descriptor'
          assert cfg['desktopUpdateSource'] == {'provider': 'github', 'repository': os.environ['DESKTOP_GITHUB_REPOSITORY'].lower()}, cfg['desktopUpdateSource']
          # The pin: exactly RELEASE_PUBLISHER (null for a plain preview), in package.json and as the single app-update.yml
          # publisherName that client/updater.cjs nativeTrust requires (electron-updater otherwise skips Authenticode).
          publisher = os.environ['RELEASE_PUBLISHER'] or None
          assert cfg['windowsPublisherName'] == publisher, (cfg['windowsPublisherName'], publisher)
          yml = open(os.path.join(os.environ['UNPACKED'], 'resources', 'app-update.yml'), encoding='utf-8').read().splitlines()
          i, names = (yml.index('publisherName:') + 1 if 'publisherName:' in yml else len(yml)), []
          while i < len(yml) and yml[i].startswith('  - '):
              names.append(yml[i][4:].strip().strip('\'"')); i += 1
          assert names == ([publisher] if publisher else []) and sum(l.startswith('publisherName') for l in yml) == (1 if publisher else 0), yml
          print('packaged config OK:', json.dumps({k: cfg[k] for k in ('appId', 'desktopUpdateSource', 'windowsPublisherName')}), 'app-update.yml publisherName:', names)

      # In the FINAL packaged bytes (win-unpacked and the zip): every committed notice file and the generated Python notices
      # byte-identical, and every native R and Node file equal to the committed manifest. Runs before any upload.
      - name: Gate - notices and native files in the packaged bytes
        shell: python
        run: |
          import hashlib, json, os, pathlib, zipfile
          env = os.environ; out = pathlib.Path(env['OUT'])
          digest = lambda b: hashlib.sha256(b).hexdigest()
          def fsha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''): h.update(b)
              return h.hexdigest()
          rt = 'resources/runtime/mentat/'
          src = pathlib.Path(env['NOTICES_DIR'])
          expected = {rt + 'THIRD-PARTY-NOTICES/' + p.name: digest(p.read_bytes()) for p in src.iterdir() if p.is_file()}
          expected[rt + 'THIRD-PARTY-NOTICES/Python-and-packages.md'] = digest((out / 'Python-and-packages.md').read_bytes())
          unpacked = pathlib.Path(env['UNPACKED'])
          shipped = {rt + 'THIRD-PARTY-NOTICES/' + q.name for q in (unpacked / rt / 'THIRD-PARTY-NOTICES').iterdir()}
          assert shipped == set(expected), f'notice set differs: {sorted(shipped ^ set(expected))}'
          bad = [p for p, h in expected.items() if digest((unpacked / p).read_bytes()) != h]
          assert not bad, f'win-unpacked notice mismatch: {bad}'
          dists = {q.name for q in (unpacked / rt / 'python' / 'Lib' / 'site-packages').glob('*.dist-info')}
          assert len(dists) == (out / 'Python-and-packages.md').read_text(encoding='utf-8').count('<https://pypi.org/project/'), 'Python notices do not list every bundled package'
          want = dict(reversed(l.rstrip('\n').split('  ', 1)) for l in open(env['NATIVE_MANIFEST'], encoding='utf-8'))
          native = unpacked / rt / 'native'
          have = {p.relative_to(native).as_posix(): fsha(p) for p in native.rglob('*') if p.is_file()}
          badn = sorted(p for p in set(want) | set(have) if want.get(p) != have.get(p))
          assert not badn, f'{len(badn)} packaged native files differ from the manifest: {badn[:20]}'
          with zipfile.ZipFile(out / f"{env['PRODUCT']}-{env['VERSION']}-win-x64-unsigned-preview.zip") as z:
              names = {n.replace('\\', '/'): n for n in z.namelist()}
              bad = [p for p, h in expected.items() if p not in names or digest(z.read(names[p])) != h]
              assert not bad, f'zip notice mismatch: {bad}'
              zipped = {p for p in names if p.startswith(rt + 'THIRD-PARTY-NOTICES/') and not p.endswith('/')}
              assert zipped == set(expected), 'zip notice set differs'
          (out / 'notice-gate.json').write_text(json.dumps({'checked': sorted(expected), 'winUnpacked': 'identical', 'zip': 'identical',
                                                            'nativeFilesEqualManifest': len(have)}, indent=2), encoding='utf-8')
          print(f'{len(expected)} notice files identical in win-unpacked and zip; {len(have)} packaged native files equal the manifest')

      # Headless only: native dependencies (private Python job, R with the inventoried packages, Node; no browser, Mentat
      # ships none) and the backend on empty scratch data. No installer execution, no Electron/GUI launch.
      - name: Smoke - packaged native dependencies and backend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rt = Join-Path $env:UNPACKED 'resources\runtime\mentat'
          & "$env:VENV\Scripts\python.exe" ops/desktop/packaging/smoke_native_dependencies.py --runtime $rt --output "$env:OUT\smoke-native.json" --skip-browser
          & "$env:VENV\Scripts\python.exe" ops/desktop/packaging/smoke_backend.py --app mentat --runtime $rt --output "$env:OUT\smoke-backend.json"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Out-String

      - name: Provenance and SHA256SUMS
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, datetime
          out = pathlib.Path(os.environ['OUT']); env = os.environ
          def sha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''): h.update(b)
              return h.hexdigest()
          product, version = env['PRODUCT'], env['VERSION']
          files = [f'{product}-{version}-win-x64-unsigned-installer.exe', f'{product}-{version}-win-x64-unsigned-preview.zip',
                   'R-and-Node-SOURCES.md', 'Python-and-packages.md']
          log = (out / 'npm-test.log').read_text(encoding='utf-8', errors='replace')
          counts = {k: int(v) for k, v in re.findall(r'^(?:\S+ )?(tests|pass|fail|cancelled|skipped|todo) (\d+)\s*$', log, re.M)}
          assert counts.get('fail', 1) == 0 and counts.get('pass', 0) > 0, counts
          gate = json.loads((out / 'notice-gate.json').read_text(encoding='utf-8'))
          publisher = env['RELEASE_PUBLISHER'] or None
          prov = {
            'app': env['APP'], 'version': version, 'signed': False, 'releaseState': 'draft',
            'channel': 'signed-release input (unsigned here; Authenticode-signed on the release owner PC)' if publisher else 'manual-install preview',
            'stableTag': env['STABLE_TAG'] or None,
            'repository': f"https://github.com/{env['GITHUB_REPOSITORY']}", 'sourceCommit': env['GITHUB_SHA'],
            'releaseTarget': env['RELEASE_TARGET'], 'reviewedBase': env['REVIEWED_BASE'], 'ciOnlyFilesAboveBase': env['CI_FILES'].split(),
            'desktopTooling': f"ops/desktop at {env['GITHUB_SHA']} (synced from pjg93-222/Melange 8f44cb6a2c8410a618a24680a42cfd1ca2e1aed7)",
            'runId': env['GITHUB_RUN_ID'], 'runAttempt': env['GITHUB_RUN_ATTEMPT'],
            'runUrl': f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}",
            'event': env['GITHUB_EVENT_NAME'], 'runner': {'os': env.get('ImageOS'), 'image': env.get('ImageVersion'), 'label': 'windows-2022'},
            'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'toolchain': {'python': '3.12.10 (actions/setup-python, fresh venv, --require-hashes from ' + env['CONSTRAINTS'] + ')',
                          'node': os.popen('node -v').read().strip(), 'electron': '44.7.2', 'electronBuilder': '26.15.3',
                          'pipFreeze': (out / 'pip-freeze.txt').read_text(encoding='utf-8').split()},
            'environment': {k: env[k] for k in ('DESKTOP_APP_ID', 'DESKTOP_UPDATE_PROVIDER', 'DESKTOP_GITHUB_REPOSITORY', 'CSC_IDENTITY_AUTO_DISCOVERY')},
            'windowsPublisherName': publisher, 'accessTrust': {'file': env['TRUST_FILE'], 'sha256': env['TRUST_SHA256']},
            'nativeRuntimes': {
              'R': {'version': '4.6.0', 'packages': 'native/R/dependency-inventory.json; 97 library directories (see R-and-Node-SOURCES.md)',
                    'license': 'GPL-2 | GPL-3 (native/R/COPYING); packages per R-and-Node-SOURCES.md'},
              'Node': {'version': 'v24.18.0', 'license': 'MIT (native/Node/LICENSE.txt)'},
              'method': 'restored unmodified from the published Mentat 1.0.3 preview zip (R frozen, D-M9); every file equal to ' + env['NATIVE_MANIFEST'] + ' before the build and in win-unpacked',
              'zip': env['NATIVE_ZIP_URL'], 'zipSha256': env['NATIVE_ZIP_SHA256'], 'zipBytes': int(env['NATIVE_ZIP_SIZE']),
              'manifestSha256': sha(env['NATIVE_MANIFEST']),
              'origin': 'prepare_r.py copy of the CRAN Windows R 4.6.0 and CRAN binary packages (2026-10-14); not rebuilt from upstream source on this runner'},
            'redistributionReview': {
              'status': 'owner-ruling-pending',
              'basis': ['notices inside the package (release-owner ruling D-M4): R GPL notice, R and Node sources with sha256, the 1.0.3 sources and notices documents, generated Python notices',
                        'native R and Node binaries unmodified (per-file manifest)'],
              'open': ['GPL written source offer and contact: not set (owner)', 'not legal clearance; the 1.0.3 documents list the remaining gaps'],
              'evidence': {'noticeGate': gate, 'rSourcesSha256': sha(out / 'R-and-Node-SOURCES.md'), 'pythonNoticesSha256': sha(out / 'Python-and-packages.md')}},
            'verified': {'clientTests': counts, 'npmAudit': 'omit=dev, audit-level=high: pass', 'pythonInstall': '--require-hashes, pip check',
                         'pythonTests': 'desktop boundary tests (explicit list) and test_github_release.py with client cross-checks: pass (python-tests.log)',
                         'nativeRuntimeGate': 'missingNativeRuntimes == [] and every native file equal to the committed manifest (restored tree and win-unpacked)',
                         'noticeGate': 'committed notices and generated Python notices byte-identical in win-unpacked and zip',
                         'packagedConfig': 'version, appId, access trust == committed descriptor, update source, publisher == RELEASE_PUBLISHER (package.json and app-update.yml)',
                         'installerAuthenticode': 'NotSigned',
                         'smokeNative': json.loads((out / 'smoke-native.json').read_text(encoding='utf-8')),
                         'smokeBackend': json.loads((out / 'smoke-backend.json').read_text(encoding='utf-8'))},
            'notVerified': ['NSIS installation', 'packaged Electron/GUI launch', 'approved application functions behind the access gate',
                            'update acceptance', 'code signing', 'mentat/tests suites (need private fixtures)',
                            'test_mentat_layout index-identity case (needs MENTAT_TEST_ENGINE)', 'numeric parity'],
            'artifacts': {f: {'bytes': (out / f).stat().st_size, 'sha256': sha(out / f)} for f in files},
          }
          name = f'{product}-{version}-provenance.json'
          (out / name).write_text(json.dumps(prov, indent=2), encoding='utf-8', newline='\n')
          files.append(name)
          (out / 'SHA256SUMS.txt').write_text(''.join(f'{sha(out / f)}  {f}\n' for f in files), encoding='utf-8', newline='\n')
          print((out / 'SHA256SUMS.txt').read_text())

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (= v4.6.2)
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ runner.temp }}/out/Mentat-${{ env.VERSION }}-win-x64-unsigned-installer.exe
            ${{ runner.temp }}/out/Mentat-${{ env.VERSION }}-win-x64-unsigned-preview.zip
            ${{ runner.temp }}/out/Mentat-${{ env.VERSION }}-provenance.json
            ${{ runner.temp }}/out/R-and-Node-SOURCES.md
            ${{ runner.temp }}/out/Python-and-packages.md
            ${{ runner.temp }}/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: [preflight, build]
    if: >-
      always() && needs.preflight.result == 'success' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.preflight.outputs.mode == 'resume')) &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # create the draft and upload assets
      actions: read     # download the build artifact (also from the original run when resuming)
    steps:
      - name: Create or resume the DRAFT, upload missing assets, verify (stops at draft)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GH_REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN")
          # The build artifact: this run's (also across re-run attempts), else the newest unexpired one of this name.
          if [ "$BUILD_RESULT" = success ]; then
            build_run="$GITHUB_RUN_ID"
          else
            build_run=$(gh api "repos/$GH_REPO/actions/artifacts?name=$ARTIFACT&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          fi
          gh run download "$build_run" -n "$ARTIFACT" -D release \
            || { echo "::error::build artifact $ARTIFACT is unavailable (7-day retention expired?). Rebuilding is a deliberate decision: delete the stale draft by hand, then dispatch."; exit 1; }
          cd release
          sha256sum -c SHA256SUMS.txt
          prov="$PRODUCT-$VERSION-provenance.json"
          jq -e --arg sha "$GITHUB_SHA" --arg run "$build_run" --arg t "$RELEASE_TARGET" \
            '.sourceCommit == $sha and .runId == $run and .releaseTarget == $t and .signed == false and .releaseState == "draft" and (.redistributionReview.status | type) == "string"' "$prov" >/dev/null
          expected=("$PRODUCT-$VERSION-win-x64-unsigned-installer.exe" "$PRODUCT-$VERSION-win-x64-unsigned-preview.zip" "$prov" R-and-Node-SOURCES.md Python-and-packages.md SHA256SUMS.txt)
          # Authoritative re-check of every release named RELEASE_TAG, drafts included.
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate | jq -s --arg t "$RELEASE_TAG" '[add[] | select(.tag_name == $t)]' > ../matches.json
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then echo "::error::tag $RELEASE_TAG exists"; exit 1; fi
          if [ "$(jq length ../matches.json)" -eq 0 ]; then
            if [ -n "$RELEASE_PUBLISHER" ]; then
              update_note="- Unsigned INPUT of the signed release $STABLE_TAG. Its updater is pinned to the publisher subject $RELEASE_PUBLISHER and installs only signed desktop-v* releases that Windows reports Valid for exactly that subject; machines that do not trust that self-signed certificate never update. This prerelease's tag does not match the updater's release pattern."
            else
              update_note="- Automatic updates are not available for this build. Updates require a signed desktop-v* release, and the updater refuses unsigned installers. This prerelease's tag does not match the updater's release pattern, so no installed client treats it as an update."
            fi
            cat > ../notes.md <<EOF
          **Draft for owner review.** Unsigned manual-install PREVIEW of $PRODUCT $VERSION for Windows x64. This is not a regular release.

          **Source**
          - Built from $GITHUB_REPOSITORY main, commit $GITHUB_SHA: reviewed source $REVIEWED_BASE plus CI-only files ($CI_FILES). The release targets $RELEASE_TARGET.
          - Built by GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$build_run on a standard hosted windows-2022 runner.

          **Read before installing**
          - NOT CODE-SIGNED. Windows SmartScreen will warn you.
          $update_note
          - The installer REPLACES an existing $PRODUCT installation for the same Windows user. Back up first if you have one.
          - Access requires an administrator approval from the Melange access server. New users who are not on the access server's LAN cannot enroll yet.

          **Third-party software**
          - Includes R 4.6.0 and R packages (GPL-2 | GPL-3 and the package licenses listed) and Node.js 24.18.0 (MIT), unmodified binaries restored from the published Mentat 1.0.3 preview and checked file by file. Upstream source URLs with sha256 are in R-and-Node-SOURCES.md (attached, and inside the package with the R GPL notice and the 1.0.3 sources and notices documents). The GPL written source offer is not yet set by the owner.
          - Includes CPython 3.12.10 and Python packages. Their licenses and sources are in Python-and-packages.md (attached, and inside the package).

          **What was verified on the runner**
          - Client tests, npm audit (production, high), a hash-locked Python install, the desktop boundary and release-producer tests, the native-runtime gate (every R and Node file equal to the committed manifest), notice files byte-identical in the packaged bytes, the packaged configuration (access trust equals the installed apps' public descriptor; update source $GITHUB_REPOSITORY; publisher pin ${RELEASE_PUBLISHER:-none}), installer Authenticode NotSigned, and headless smokes of the packaged native dependencies and backend on empty data.

          **What was NOT verified**
          - NSIS install, packaged GUI launch, approved application functions behind the access gate, update acceptance, code signing, the mentat/tests suites, and numeric parity.

          **Files**: installer, preview zip (win-unpacked), provenance JSON, R-and-Node-SOURCES.md, Python-and-packages.md, SHA256SUMS.txt.
          EOF
            jq -n --arg tag "$RELEASE_TAG" --arg target "$RELEASE_TARGET" --arg name "$PRODUCT $VERSION — unsigned manual-install preview (draft)" \
              --rawfile body ../notes.md '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: true}' \
              | gh api -X POST "repos/$GH_REPO/releases" --input - --jq .id > ../rid
            rid=$(cat ../rid)
          elif jq -e --arg t "$RELEASE_TARGET" 'length == 1 and .[0].draft == true and .[0].target_commitish == $t' ../matches.json >/dev/null; then
            rid=$(jq -r '.[0].id' ../matches.json); echo "resuming draft $rid"
          else
            echo "::error::$RELEASE_TAG is published, duplicated or targets another commit"; jq '[.[] | {id, draft, target_commitish}]' ../matches.json; exit 1
          fi
          echo "release id $rid"
          # Validate what is already attached (by release ID): names, sizes, sha256. Then upload only what is missing.
          verify_assets() {
            gh api "repos/$GH_REPO/releases/$rid" --jq '.assets[] | [.id, .name, .size] | @tsv' > ../assets.tsv
            while IFS=$'\t' read -r aid name size; do
              printf '%s\n' "${expected[@]}" | grep -qxF -- "$name" || { echo "::error::unexpected asset $name on draft $rid"; exit 1; }
              [ "$size" = "$(stat -c %s "$name")" ] || { echo "::error::asset $name size $size differs from the build"; exit 1; }
              curl -fsSL "${auth[@]}" -H 'Accept: application/octet-stream' "$api/releases/assets/$aid" -o "../check.bin"
              [ "$(sha256sum ../check.bin | cut -d' ' -f1)" = "$(sha256sum "$name" | cut -d' ' -f1)" ] || { echo "::error::asset $name sha256 differs from the build"; exit 1; }
              rm ../check.bin
            done < ../assets.tsv
          }
          verify_assets
          for f in "$prov" SHA256SUMS.txt R-and-Node-SOURCES.md Python-and-packages.md "${expected[0]}" "${expected[1]}"; do
            if ! cut -f2 ../assets.tsv | grep -qxF -- "$f"; then
              echo "uploading missing $f"
              curl -fsS "${auth[@]}" -X POST -H 'Content-Type: application/octet-stream' -T "$f" \
                "https://uploads.github.com/repos/$GH_REPO/releases/$rid/assets?name=$f" >/dev/null
            fi
          done
          verify_assets
          [ "$(wc -l < ../assets.tsv)" -eq "${#expected[@]}" ] || { echo "::error::draft $rid does not hold exactly the expected assets"; exit 1; }
          # STOP: the release stays a draft for owner review (no tag exists until a reviewed change publishes it).
          gh api "repos/$GH_REPO/releases/$rid" --jq '{id, tag_name, draft, prerelease, target_commitish, assets: [.assets[] | {name, size}]}' | tee ../state.json
          jq -e --arg t "$RELEASE_TARGET" '.draft == true and .prerelease == true and .target_commitish == $t' ../state.json >/dev/null
