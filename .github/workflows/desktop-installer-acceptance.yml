# Post-publication1.0.15 artifact-authority/payload audit. No installer or app execution.
# Existing compiled update keys authenticate the manifest; release.json/SUMS are descriptive.
# Native Windows signature metadata is observed unchanged, with all platform/crypto verification flags false.
# Local Windows Valid + exact signer/timestamp and existing-profile installed-first gates remain prerequisites.
# This file is the ONLY proposed repository path. desktop-windows trigger filters remain untouched.
name: desktop-installer-acceptance
run-name: Mentat 1.0.15 release authority and payload audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-installer-acceptance.yml
permissions:
  contents: read
concurrency:
  group: desktop-release-authority-mentat-1.0.15
  cancel-in-progress: false
jobs:
  artifact-authority-and-payload:
    name: Release authority and payload (native trust not assessed)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require actual installed-first publication pins; materialize reviewed helper bytes
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'pjg93-222/Mentat') { throw 'Wrong acceptance repository' }
          $pinsRaw = [Convert]::FromBase64String('')
          $pins = [Text.Encoding]::UTF8.GetString($pinsRaw) | ConvertFrom-Json
          if (-not $pins.rootReviewedStableInputs -or -not $pins.installedFirstAcceptanceSha256 -or -not $pins.publicReadbackSha256 -or -not $pins.stableReleaseId) { throw 'Actual stable publication inputs are unfilled; no audit is authorized' }
          foreach ($property in $pins.stableAssets.PSObject.Properties) {
            if (-not $property.Value.id -or -not $property.Value.bytes -or "$($property.Value.sha256)" -cnotmatch '^[0-9a-f]{64}$') { throw 'Exact stable asset pins are incomplete' }
          }
          $root = Join-Path $env:RUNNER_TEMP 'mm15-release-authority-mentat'
          New-Item -ItemType Directory -Path $root | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $root 'pins.json'), $pinsRaw)
          [IO.File]::WriteAllBytes((Join-Path $root 'audit.py'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $root 'authority.cjs'), [Convert]::FromBase64String(''))
          if ((Get-FileHash -LiteralPath (Join-Path $root 'audit.py') -Algorithm SHA256).Hash.ToLowerInvariant() -cne '3ba56f5ea019f40b8d9791c5b35f3a6a56336aa3238f9f26da52e88c11a3c2a5') { throw 'Reviewed Python helper bytes differ' }
          if ((Get-FileHash -LiteralPath (Join-Path $root 'authority.cjs') -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'db82e4ec0350f33628de7afabc7102abea8c5398313097eaa97c9d0c92b80682') { throw 'Reviewed Node helper bytes differ' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pjg93-222/Mentat
          ref: 426ddd6c52a4ad0fdbb32ec9f5352457f5bfcf01
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Restore existing locked verifier dependencies without lifecycle scripts
        working-directory: source/ops/desktop/client
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --fund=false
          if ($LASTEXITCODE -ne 0) { throw 'Existing locked verifier dependencies failed' }
      - name: Acquire exact official7-Zip tool pair without executing its setup
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mm15-release-authority-mentat'
          $arguments = @('-E','-s','-B',(Join-Path $root 'audit.py'),'--plan',(Join-Path $root 'pins.json'),'--source',(Join-Path $env:GITHUB_WORKSPACE 'source'),'--root',(Join-Path $root 'sevenzip'),'--seven-zip',(Join-Path $root 'sevenzip/selected/7z.exe'),'--node',(Get-Command node).Source,'--authority-helper',(Join-Path $root 'authority.cjs'),'--prepare-tools')
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Pinned official tool acquisition failed' }
      - name: Verify signed release authority, exact owned build, PE binding and every payload byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mm15-release-authority-mentat'
          $arguments = @('-E','-s','-B',(Join-Path $root 'audit.py'),'--plan',(Join-Path $root 'pins.json'),'--source',(Join-Path $env:GITHUB_WORKSPACE 'source'),'--root',(Join-Path $root 'result'),'--seven-zip',(Join-Path $root 'sevenzip/selected/7z.exe'),'--node',(Get-Command node).Source,'--authority-helper',(Join-Path $root 'authority.cjs'))
          $summary = & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Artifact-authority/payload audit refused; owned evidence is retained' }
          $summary | Write-Output
          $result = $summary | ConvertFrom-Json
          if ($result.nativeNeedsAttention) { Write-Warning 'Native signature observation is inconclusive and needs attention; this audit does not verify native platform trust or Authenticode/timestamp cryptography.' }
      - name: Upload only the bounded audit evidence; never payloads or trust material
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-authority-mentat-1.0.15-${{ github.run_id }}
          path: ${{ runner.temp }}/mm15-release-authority-mentat/result/acceptance.json
          if-no-files-found: warn
          retention-days: 7
